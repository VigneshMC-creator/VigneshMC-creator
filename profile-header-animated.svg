<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Vignesh Madhav Kumar Edara — Full Stack .NET Developer</title>
  <desc id="desc">A standing developer works on a laptop connected to a stable server rack. Server status lights blink and data pulses travel along the connection cable.</desc>

  <rect width="1400" height="420" rx="22" fill="#061526"/>
  <path d="M0 318H1400M0 350H1400" stroke="#0d2a43" stroke-width="1"/>
  <path d="M0 0H1400V420H0Z" fill="none" stroke="#143958" stroke-width="2"/>

  <!-- Background circuit traces -->
  <g fill="none" stroke="#10334f" stroke-width="1.3" opacity=".8">
    <path d="M0 74H520V118H760"/>
    <path d="M0 96H440V143H710"/>
    <path d="M0 290H570V264H750"/>
    <path d="M680 0V38H790V58"/>
    <path d="M1070 0V32H1160"/>
    <path d="M1250 390V370H1400"/>
  </g>
  <g fill="#1a5475">
    <circle cx="520" cy="74" r="3"/><circle cx="440" cy="96" r="3"/>
    <circle cx="570" cy="290" r="3"/><circle cx="790" cy="58" r="3"/>
    <circle cx="1160" cy="32" r="3"/><circle cx="1250" cy="370" r="3"/>
  </g>

  <!-- Intro text -->
  <rect x="54" y="55" width="5" height="245" rx="2.5" fill="#21c6e5"/>
  <text x="88" y="81" fill="#4ed7ee" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="4">HELLO, I'M</text>
  <text x="88" y="137" fill="#f4f8fc" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="800" letter-spacing=".1">VIGNESH MADHAV KUMAR EDARA</text>
  <text x="90" y="190" fill="#57d7ea" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="1.4">FULL STACK .NET DEVELOPER</text>
  <text x="90" y="231" fill="#a9bfd2" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing=".8">BUILDING SECURE, EFFICIENT &amp; MAINTAINABLE APPLICATIONS</text>

  <!-- Technology chips -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">
    <rect x="88" y="270" width="74" height="38" rx="8" fill="#4125a4"/><text x="125" y="295" text-anchor="middle" fill="#fff">C#</text>
    <rect x="175" y="270" width="84" height="38" rx="8" fill="#173b65" stroke="#2678b6"/><text x="217" y="295" text-anchor="middle" fill="#e9f5ff">.NET</text>
    <rect x="272" y="270" width="164" height="38" rx="8" fill="#102c46" stroke="#1b6688"/><text x="354" y="295" text-anchor="middle" fill="#d8efff">ASP.NET CORE</text>
    <rect x="449" y="270" width="105" height="38" rx="8" fill="#102c46" stroke="#1b6688"/><text x="501" y="295" text-anchor="middle" fill="#d8efff">ANGULAR</text>
    <rect x="567" y="270" width="135" height="38" rx="8" fill="#102c46" stroke="#1b6688"/><text x="634" y="295" text-anchor="middle" fill="#d8efff">SQL SERVER</text>
    <rect x="715" y="270" width="96" height="38" rx="8" fill="#102c46" stroke="#1b6688"/><text x="763" y="295" text-anchor="middle" fill="#d8efff">AZURE</text>
  </g>

  <!-- Subtle fixed data bus feeding the server rack; only the data pulses move -->
  <path d="M835 340 H1136" fill="none" stroke="#123a57" stroke-width="3" stroke-linecap="round"/>
  <path d="M835 340 H1136" fill="none" stroke="#17688b" stroke-width="1" stroke-dasharray="3 10" opacity=".9"/>
  <path d="M835 340 H1136" fill="none" stroke="#31cde9" stroke-width="1" opacity=".22"/>
  <circle cx="875" cy="340" r="3" fill="#1d7898"/>
  <circle cx="1000" cy="340" r="3" fill="#1d7898"/>
  <circle cx="1090" cy="340" r="3" fill="#1d7898"/>
  <circle r="4.5" fill="#a8f7ff">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M835 340 H1136"/>
  </circle>
  <circle r="3" fill="#2edcff">
    <animateMotion dur="3.2s" begin="1.6s" repeatCount="indefinite" path="M835 340 H1136"/>
  </circle>

  <!-- Stable server rack -->
  <g>
    <rect x="1136" y="46" width="211" height="337" rx="10" fill="#08111f" stroke="#23678b" stroke-width="3"/>
    <rect x="1148" y="58" width="187" height="312" rx="5" fill="#0c2135" stroke="#154767" stroke-width="1.5"/>
    <rect x="1160" y="70" width="162" height="82" rx="5" fill="#102c43" stroke="#285878"/>
    <rect x="1160" y="161" width="162" height="82" rx="5" fill="#102c43" stroke="#285878"/>
    <rect x="1160" y="252" width="162" height="105" rx="5" fill="#102c43" stroke="#285878"/>
    <g stroke="#25516c" stroke-width="2">
      <path d="M1174 88H1308M1174 110H1308M1174 179H1308M1174 201H1308M1174 270H1308M1174 292H1308M1174 314H1308"/>
    </g>
    <g fill="#1a3f59">
      <rect x="1174" y="79" width="52" height="5" rx="2"/><rect x="1174" y="170" width="52" height="5" rx="2"/>
      <rect x="1174" y="261" width="52" height="5" rx="2"/>
    </g>
    <!-- Status LEDs: the rack and its panels remain still -->
    <g>
      <circle cx="1290" cy="84" r="4" fill="#26e4a1"><animate attributeName="opacity" values=".2;1;.25" dur="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="1305" cy="84" r="4" fill="#22c9ee"><animate attributeName="opacity" values="1;.25;1" dur="1.3s" repeatCount="indefinite"/></circle>
      <circle cx="1290" cy="103" r="4" fill="#26e4a1"><animate attributeName="opacity" values=".2;1;.2" dur="2.1s" begin=".4s" repeatCount="indefinite"/></circle>
      <circle cx="1305" cy="103" r="4" fill="#22c9ee"><animate attributeName="opacity" values=".2;1;.2" dur="1.6s" begin=".6s" repeatCount="indefinite"/></circle>
      <circle cx="1290" cy="175" r="4" fill="#26e4a1"><animate attributeName="opacity" values=".2;1;.2" dur="1.5s" begin=".3s" repeatCount="indefinite"/></circle>
      <circle cx="1305" cy="175" r="4" fill="#22c9ee"><animate attributeName="opacity" values="1;.25;1" dur="1.9s" repeatCount="indefinite"/></circle>
      <circle cx="1290" cy="194" r="4" fill="#26e4a1"><animate attributeName="opacity" values=".2;1;.2" dur="2s" begin=".7s" repeatCount="indefinite"/></circle>
      <circle cx="1305" cy="194" r="4" fill="#22c9ee"><animate attributeName="opacity" values=".2;1;.2" dur="1.4s" begin=".2s" repeatCount="indefinite"/></circle>
      <circle cx="1290" cy="266" r="4" fill="#26e4a1"><animate attributeName="opacity" values="1;.2;1" dur="1.7s" repeatCount="indefinite"/></circle>
      <circle cx="1305" cy="266" r="4" fill="#22c9ee"><animate attributeName="opacity" values=".2;1;.2" dur="2.1s" begin=".4s" repeatCount="indefinite"/></circle>
      <circle cx="1290" cy="287" r="4" fill="#26e4a1"><animate attributeName="opacity" values=".2;1;.2" dur="1.4s" begin=".5s" repeatCount="indefinite"/></circle>
      <circle cx="1305" cy="287" r="4" fill="#22c9ee"><animate attributeName="opacity" values="1;.2;1" dur="1.9s" repeatCount="indefinite"/></circle>
      <circle cx="1290" cy="330" r="4" fill="#26e4a1"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" begin=".2s" repeatCount="indefinite"/></circle>
      <circle cx="1305" cy="330" r="4" fill="#22c9ee"><animate attributeName="opacity" values=".2;1;.2" dur="1.6s" repeatCount="indefinite"/></circle>
    </g>
    <text x="1242" y="392" fill="#4c7892" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2" text-anchor="middle">SERVER ONLINE</text>
  </g>
</svg>