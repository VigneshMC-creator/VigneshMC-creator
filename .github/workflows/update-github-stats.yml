name: Refresh GitHub profile activity

on:
  push:
    branches:
      - Master
    paths:
      - README.md
      - .github/workflows/update-github-stats.yml
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Generate GitHub activity statistics
        uses: cicirello/user-statistician@v1
        with:
          image-file: github-stats.svg
          custom-title: GitHub Activity & Stats
          colors: "#ffffff #d0d7de #0797b6 #17324d #536579"
          max-languages: 8
          hide-keys: joined, mostStarred, mostForked, followers, following, private
          category-order: contributions, repositories, languages
          border-radius: 10
          show-border: true
          image-width: 850
          commit-and-push: false
          commit-message: "chore: refresh GitHub profile statistics"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert generated SVG to PNG for reliable README rendering
        run: |
          python -m pip install --disable-pip-version-check CairoSVG
          python -m cairosvg github-stats.svg --output github-stats.png

      - name: Commit updated statistics images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg github-stats.png
          if git diff --cached --quiet; then
            echo "Statistics images are already up to date."
          else
            git commit -m "chore: refresh GitHub profile statistics"
            git push
          fi
